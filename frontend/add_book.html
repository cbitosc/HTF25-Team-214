<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add a Book</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Add a Book</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="view_book.html">View Books</a>
    </nav>
  </header>

  <section class="form-section">
    <form id="bookForm">
      <input type="text" id="title" placeholder="Book Title" required><br>
      <input type="text" id="author" placeholder="Author" required><br>
      <input type="text" id="genre" placeholder="Genre" required><br>
      <input type="text" id="location" placeholder="Location (City/Area)" required><br>
      <button type="submit">Add Book</button>
    </form>
  </section>

  <script src="script.js"></script>
</body>
</html>
